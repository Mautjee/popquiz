{{define "question_edit_form"}}
<div id="question-{{.Question.ID}}" class="bg-gray-600 rounded p-4 question-row" draggable="true" data-question-id="{{.Question.ID}}">
    <form hx-post="/admin/quiz/{{.QuizID}}/question/{{.Question.ID}}"
          hx-target="#question-{{.Question.ID}}"
          hx-swap="outerHTML"
          enctype="multipart/form-data"
          class="space-y-3">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Question Text</label>
            <input type="text" name="question_text" required value="{{.Question.QuestionText}}"
                   class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>
        {{if eq .QuizMode "online"}}
        <div class="flex gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Type</label>
                <select name="question_type" class="px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg question-type-select"
                        onchange="toggleQuestionFields(this)">
                    <option value="open" {{if eq .Question.QuestionType "open"}}selected{{end}}>Open</option>
                    <option value="ranged" {{if eq .Question.QuestionType "ranged"}}selected{{end}}>Ranged</option>
                    <option value="multiple_choice" {{if eq .Question.QuestionType "multiple_choice"}}selected{{end}}>Multiple Choice</option>
                </select>
            </div>
        </div>
        {{else}}
        <input type="hidden" name="question_type" value="open">
        {{end}}
        <div id="video-section-{{.Question.ID}}">
            {{if .Question.VideoFilename.Valid}}
            <div class="flex items-center gap-2 mb-3">
                <span class="text-sm text-purple-400">📹 {{.Question.VideoFilename.String}}</span>
                <a href="/static/videos/{{.Question.VideoFilename.String}}" target="_blank" class="text-blue-400 hover:text-blue-300 text-xs">▶ Preview</a>
                <button type="button"
                        hx-post="/admin/quiz/{{.QuizID}}/question/{{.Question.ID}}/delete-video"
                        hx-target="#video-section-{{.Question.ID}}"
                        hx-swap="outerHTML"
                        hx-confirm="Delete this video?"
                        class="text-red-400 hover:text-red-300 text-xs">🗑 Delete video</button>
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-300 mb-1">Replace Video</label>
                <input type="file" name="video_file" accept="video/*" class="w-full text-gray-300 text-sm">
            </div>
            {{else}}
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-300 mb-1">Video Clip</label>
                <input type="file" name="video_file" accept="video/*" class="w-full text-gray-300 text-sm">
            </div>
            {{end}}
        </div>
        <div class="mb-3">
            <label class="block text-sm font-medium text-gray-300 mb-1">Image (optional)</label>
            {{if .Question.ImageFilename.Valid}}
            <div class="mb-2">
                <img src="/images/{{.Question.ImageFilename.String}}" class="h-16 object-contain rounded inline-block">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Replace Image</label>
                <input type="file" name="image_file" accept="image/*" class="w-full text-gray-300 text-sm">
            </div>
            {{else}}
            <input type="file" name="image_file" accept="image/*" class="w-full text-gray-300 text-sm">
            {{end}}
        </div>
        {{template "question_fields" .}}
        <div class="flex gap-2">
            <button type="submit" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg font-semibold text-white transition text-sm">
                💾 Save
            </button>
            <button type="button"
                    hx-get="/admin/quiz/{{.QuizID}}/question/{{.Question.ID}}/row"
                    hx-target="#question-{{.Question.ID}}"
                    hx-swap="outerHTML"
                    class="px-4 py-2 bg-gray-500 hover:bg-gray-400 rounded-lg font-semibold text-white transition text-sm">
                Cancel
            </button>
        </div>
    </form>
    <script>
    // Initialize MC fields visibility on load for edit forms loaded via HTMX
    (function() {
        var typeSelect = document.querySelector('#question-{{.Question.ID}} .question-type-select');
        if (typeSelect) {
            toggleQuestionFields(typeSelect);
        }
    })();
    </script>
</div>
{{end}}
