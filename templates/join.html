{{template "base.html" .}}

{{define "title"}}Join PopQuiz{{end}}

{{define "content"}}
<div class="max-w-md mx-auto mt-16 p-8 bg-gray-800 rounded-xl shadow-lg">
    <h1 class="text-3xl font-bold text-center mb-8 text-indigo-400">🎯 PopQuiz</h1>

    {{if .Error}}
    <div class="bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded mb-4">
        {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/join/room" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Room Code</label>
            <input type="text" name="code" value="{{.Code}}" maxlength="6"
                   class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-center text-2xl font-mono uppercase tracking-widest focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                   placeholder="ABC123" required
                   oninput="this.value=this.value.toUpperCase()">
        </div>
        <button type="submit"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold text-white transition">
            Join Game
        </button>
    </form>
</div>
{{end}}
