{{define "quiz_row"}}
<div id="quiz-row-{{.ID}}" class="bg-gray-800 rounded-lg p-6 flex justify-between items-center">
    <div>
        <h2 class="text-xl font-semibold">{{.Title}}</h2>
        <p class="text-gray-400 text-sm">Created {{.CreatedAt}} · <span class="{{if eq .Mode "offline"}}text-orange-400{{else}}text-green-400{{end}}">{{if eq .Mode "offline"}}🖊️ Paper Round{{else}}📱 Live Quiz{{end}}</span></p>
    </div>
    <div class="flex gap-3">
        <a href="/admin/quiz/{{.ID}}" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-white transition text-sm">
            Edit
        </a>
        <button hx-get="/admin/quiz/{{.ID}}/delete-confirm"
                hx-target="#quiz-row-{{.ID}}"
                hx-swap="outerHTML"
                class="text-red-400 hover:text-red-300 text-2xl px-2"
                title="Delete quiz">
            🗑️
        </button>
    </div>
</div>
{{end}}
