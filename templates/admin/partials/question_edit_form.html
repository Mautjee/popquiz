{{define "question_edit_form"}}
<div id="question-{{.Question.ID}}" class="bg-gray-600 rounded p-4">
    <form hx-post="/admin/quiz/{{.QuizID}}/question/{{.Question.ID}}"
          hx-target="#question-{{.Question.ID}}"
          hx-swap="outerHTML"
          class="space-y-3">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Question Text</label>
            <input type="text" name="question_text" required value="{{.Question.QuestionText}}"
                   class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>
        <div class="flex gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Type</label>
                <select name="question_type" class="px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg question-type-select"
                        onchange="toggleQuestionFields(this)">
                    <option value="open" {{if eq .Question.QuestionType "open"}}selected{{end}}>Open</option>
                    <option value="ranged" {{if eq .Question.QuestionType "ranged"}}selected{{end}}>Ranged</option>
                    <option value="multiple_choice" {{if eq .Question.QuestionType "multiple_choice"}}selected{{end}}>Multiple Choice</option>
                </select>
            </div>
        </div>
        {{template "question_fields" .}}
        <div class="flex gap-2">
            <button type="submit" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg font-semibold text-white transition text-sm">
                💾 Save
            </button>
            <button type="button"
                    hx-get="/admin/quiz/{{.QuizID}}/question/{{.Question.ID}}/row"
                    hx-target="#question-{{.Question.ID}}"
                    hx-swap="outerHTML"
                    class="px-4 py-2 bg-gray-500 hover:bg-gray-400 rounded-lg font-semibold text-white transition text-sm">
                Cancel
            </button>
        </div>
    </form>
    <script>
    // Initialize MC fields visibility on load
    (function() {
        // Use the same toggleQuestionFields as quiz_editor
        // The edit form is loaded via HTMX, so we need this script
    })();
    function toggleQuestionFields(select) {
        var form = select.closest('form') || select.closest('div');
        var mcFields = form.querySelector('.mc-options-fields');
        var textField = form.querySelector('#correct-answer-text-field');
        var mcField = form.querySelector('#correct-answer-mc-field');
        if (select.value === 'multiple_choice') {
            mcFields.style.display = 'block';
            textField.style.display = 'none';
            mcField.style.display = 'block';
        } else {
            mcFields.style.display = 'none';
            textField.style.display = 'block';
            mcField.style.display = 'none';
        }
    }

    // MC options serialization for HTMX form submit
    document.querySelectorAll('form[hx-post]').forEach(function(form) {
        form.addEventListener('htmx:configRequest', function(event) {
            var typeSelect = form.querySelector('select[name="question_type"]');
            if (typeSelect && typeSelect.value === 'multiple_choice') {
                var inputs = form.querySelectorAll('.mc-option-input');
                var options = [];
                inputs.forEach(function(input) {
                    options.push(input.value.trim());
                });
                var hiddenInput = form.querySelector('input[name="options"]');
                if (hiddenInput) {
                    hiddenInput.value = JSON.stringify(options);
                }
                var correctInput = form.querySelector('input[name="correct_answer"]');
                var mcCorrect = form.querySelector('select[name="correct_answer_mc"]');
                if (correctInput && mcCorrect) {
                    correctInput.value = mcCorrect.value;
                }
            }
        });
    });
    </script>
</div>
{{end}}
