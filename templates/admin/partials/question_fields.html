{{define "question_fields"}}
<!-- Multiple choice options -->
<div class="mc-options-fields" {{if ne .Question.QuestionType "multiple_choice"}}style="display:none;"{{end}}>
    <label class="block text-sm font-medium text-gray-300 mb-2">Options</label>
    <div class="grid grid-cols-2 gap-3">
        <div>
            <label class="block text-xs text-gray-400 mb-1">Option A</label>
            <input type="text" data-option="A" class="mc-option-input w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg"
                   placeholder="Option A" value="{{index .MCOptions 0}}">
        </div>
        <div>
            <label class="block text-xs text-gray-400 mb-1">Option B</label>
            <input type="text" data-option="B" class="mc-option-input w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg"
                   placeholder="Option B" value="{{index .MCOptions 1}}">
        </div>
        <div>
            <label class="block text-xs text-gray-400 mb-1">Option C</label>
            <input type="text" data-option="C" class="mc-option-input w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg"
                   placeholder="Option C" value="{{index .MCOptions 2}}">
        </div>
        <div>
            <label class="block text-xs text-gray-400 mb-1">Option D</label>
            <input type="text" data-option="D" class="mc-option-input w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg"
                   placeholder="Option D" value="{{index .MCOptions 3}}">
        </div>
    </div>
    <input type="hidden" name="options" id="mc-options-hidden" value="{{if .Question.Options.Valid}}{{.Question.Options.String}}{{end}}">
</div>
<div class="flex gap-4">
    <div class="flex-1" id="correct-answer-text-field" {{if eq .Question.QuestionType "multiple_choice"}}style="display:none;"{{end}}>
        <label class="block text-sm font-medium text-gray-300 mb-1">Correct Answer</label>
        <input type="text" name="correct_answer" value="{{.Question.CorrectAnswer}}"
               class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg">
    </div>
    <div class="flex-1" id="correct-answer-mc-field" {{if ne .Question.QuestionType "multiple_choice"}}style="display:none;"{{end}}>
        <label class="block text-sm font-medium text-gray-300 mb-1">Correct Answer</label>
        <select name="correct_answer_mc" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg">
            <option value="A" {{if eq .Question.CorrectAnswer "A"}}selected{{end}}>A</option>
            <option value="B" {{if eq .Question.CorrectAnswer "B"}}selected{{end}}>B</option>
            <option value="C" {{if eq .Question.CorrectAnswer "C"}}selected{{end}}>C</option>
            <option value="D" {{if eq .Question.CorrectAnswer "D"}}selected{{end}}>D</option>
        </select>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Points</label>
        <input type="number" name="points" value="{{.Question.Points}}" min="1"
               class="w-20 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg">
    </div>
</div>
{{end}}
