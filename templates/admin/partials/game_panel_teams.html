{{define "game_panel_teams"}}
<div id="teams-list">
    {{range .TeamsWithCounts}}
    <div class="team-row bg-gray-700 rounded p-3 flex justify-between items-center">
        <div>
            <p class="font-semibold">{{.Team.Name}}</p>
            <p class="text-gray-400 text-sm">Score: {{.Team.Score}} · {{.PlayerCount}} player{{if ne .PlayerCount 1}}s{{end}}</p>
        </div>
        <button hx-delete="/admin/game/{{$.Code}}/team/{{.Team.ID}}"
                hx-target="closest .team-row"
                hx-swap="outerHTML swap:0.3s"
                hx-confirm="Remove team {{.Team.Name}}?"
                class="text-red-400 hover:text-red-300 text-xs">
            ✕
        </button>
    </div>
    {{end}}
    {{if not .TeamsWithCounts}}
    <p class="text-gray-400 text-sm">No teams yet</p>
    {{end}}
</div>
{{if .TeamsWithCounts}}
<div class="mt-3">
    <button hx-post="/admin/game/{{.Code}}/reset-teams"
            hx-target="#game-state"
            hx-swap="outerHTML"
            hx-confirm="Reset all teams? This will remove all teams and kick all players back to the join screen."
            class="w-full px-4 py-2 bg-red-700 hover:bg-red-600 text-white text-sm font-semibold rounded-lg transition">
        🔄 Reset All Teams
    </button>
</div>
{{end}}
{{end}}
