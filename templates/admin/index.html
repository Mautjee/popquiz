{{template "base.html" .}}

{{define "title"}}Admin - PopQuiz{{end}}

{{define "content"}}
<div class="max-w-4xl mx-auto p-8">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-indigo-400">📋 Quizzes</h1>
        <a href="/admin/quiz/new"
           class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold text-white transition">
            New Quiz
        </a>
    </div>

    {{if .Quizzes}}
    <div class="space-y-4">
        {{range .Quizzes}}
        {{template "quiz_row" .}}
        {{end}}
    </div>
    {{else}}
    <div class="text-center py-16 text-gray-400">
        <p class="text-xl mb-2">No quizzes yet</p>
        <p>Create your first quiz to get started!</p>
    </div>
    {{end}}
</div>
{{end}}
